<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>冬期講習 受講確認票 読み取り</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #222;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;
}

header {
    background: #1769aa;
    color: white;
    padding: 20px;
}

    margin: 0;
    font-size: 22px;
}

    margin: 6px 0 0;
    font-size: 13px;
}

    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.drop {
    border: 2px dashed #aab7c4;

    border-color: #1769aa;

}

input[type="file"] {

}

button,
.file-button {
    border: none;

    cursor: pointer;
}

.file-button,
.primary {
    background: #1769aa;

}

.secondary {

}

}

    opacity: .45;

}

.controls {

    flex-wrap: wrap;
    gap: 8px;

}

.status {
    margin-top: 12px;
    font-size: 13px;
    color: #596b79;
}

.progress {
    height: 8px;
    margin-top: 8px;
    background: #e4e9ed;
    border-radius: 99px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2c8fd6;
    transition: width .2s;
}

.table-wrap {
    overflow-x: auto;
    margin-top: 14px;
}

table {
    width: 100%;
    min-width: 650px;
    border-collapse: collapse;
}

th,

    border-bottom: 1px solid #dce3e8;
    padding: 9px;
    text-align: left;
}

    background: #f4f7fa;

}

td input {
    width: 100%;
    padding: 7px;
    border: 1px solid #cbd5dd;
    border-radius: 6px;
    font-size: 14px;
}

.warning {
    background: #fff4c4;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #71808d;
}

.note {
    font-size: 12px;
    color: #697984;
    line-height: 1.7;
}
</style>
</head>

<body>

<header>
    <h1>📄 冬期講習 受講確認票 → 一覧化</h1>
    <p>PDFをアップロードすると、番号・名前・クラス・科目を自動取得します。</p>
</header>

<main>

<div class="card">

    <div id="dropArea" class="drop">

        <strong>
            スキャンしたPDFをここに入れてください
        </strong>

        <br>

        <span class="note">
            複数PDFにも対応
        </span>

        <div class="controls" style="justify-content:center">

            <label class="file-button">
                📄 PDFを選択
                <input
                    id="pdfInput"
                    type="file"
                    accept=".pdf,application/pdf"
                    multiple
                >
            </label>

        </div>

    </div>

    <div class="controls">

        <button
            id="startButton"
            class="primary"
            disabled
        >
            🔍 読み取る
        </button>

        <button
            id="csvButton"
            class="secondary"
            disabled
        >
            ⬇ CSV出力
        </button>

        <button
            id="clearButton"
            class="danger"
            disabled
        >
            クリア
        </button>

    </div>

    <div id="status" class="status">
        PDFを選択してください。
    </div>

    <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
    </div>

</div>


<div class="card">

    <strong>
        読み取り結果
    </strong>

    <span id="count">
        0件
    </span>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>No.</th>
                    <th>番号</th>
                    <th>名前</th>
                    <th>クラス</th>
                    <th>科目</th>
                    <th>PDF / ページ</th>
                </tr>
            </thead>

            <tbody id="resultBody">

                <tr>
                    <td
                        colspan="6"
                        class="empty"
                    >
                        まだ読み取り結果がありません。
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<div class="card note">

    <strong>読み取りルール</strong>

    <br><br>

    <b>変更なしの場合</b><br>
    → 「9月度クラス」をクラス欄へ入力<br>
    → 科目欄は空欄

    <br><br>

    <b>変更ありの場合</b><br>
    → クラス欄は空欄<br>
    → 指定された科目欄から科目を読み取る

    <br><br>

    一覧には
    「変更あり／なし」
    「変更内容」
    「変更理由」
    の列は作りません。

</div>

</main>


<script type="module">

/* =====================================================
   PDF.js
===================================================== */

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =====================================================
   DOM
===================================================== */

const pdfInput =
    document.getElementById("pdfInput");

const dropArea =
    document.getElementById("dropArea");

const startButton =
    document.getElementById("startButton");

const csvButton =
    document.getElementById("csvButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");

const progressBar =
    document.getElementById("progressBar");

const resultBody =
    document.getElementById("resultBody");

const count =
    document.getElementById("count");


/* =====================================================
   データ
===================================================== */

let selectedFiles = [];
let results = [];


/* =====================================================
   ファイル選択
===================================================== */

pdfInput.addEventListener(
    "change",
    () => {

        selectedFiles =
            Array.from(pdfInput.files)
            .filter(file =>
                file.type === "application/pdf" ||
                file.name.toLowerCase().endsWith(".pdf")
            );

        updateFileState();
    }
);


function updateFileState() {

    startButton.disabled =
        selectedFiles.length === 0;

    clearButton.disabled =
        selectedFiles.length === 0 &&
        results.length === 0;

    if (selectedFiles.length) {

        status.textContent =
            `${selectedFiles.length}個のPDFを選択しました。`;

    } else {

        status.textContent =
            "PDFを選択してください。";
    }
}


/* =====================================================
   ドラッグ＆ドロップ
===================================================== */

["dragenter", "dragover"].forEach(type => {

    dropArea.addEventListener(type, event => {

        event.preventDefault();

        dropArea.classList.add("drag");

    });

});


["dragleave", "drop"].forEach(type => {

    dropArea.addEventListener(type, event => {

        event.preventDefault();

        dropArea.classList.remove("drag");

    });

});


dropArea.addEventListener(
    "drop",
    event => {

        selectedFiles =
            Array.from(event.dataTransfer.files)
            .filter(file =>
                file.type === "application/pdf" ||
                file.name.toLowerCase().endsWith(".pdf")
            );

        updateFileState();
    }
);


/* =====================================================
   OCRライブラリ
===================================================== */

async function loadTesseract() {

    if (window.Tesseract) {
        return window.Tesseract;
    }

    await new Promise((resolve, reject) => {

        const script =
            document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";

        script.onload = resolve;
        script.onerror = reject;

        document.head.appendChild(script);

    });

    return window.Tesseract;
}


/* =====================================================
   PDF → Canvas
===================================================== */

async function renderPage(pdf, pageNumber) {

    const page =
        await pdf.getPage(pageNumber);

    const viewport =
        page.getViewport({
            scale: 2.5
        });

    const canvas =
        document.createElement("canvas");

    canvas.width =
        Math.ceil(viewport.width);

    canvas.height =
        Math.ceil(viewport.height);

    await page.render({
        canvasContext:
            canvas.getContext("2d"),
        viewport
    }).promise;

    return canvas;
}


/* =====================================================
   画像切り出し
===================================================== */

function crop(
    source,
    x,
    y,
    width,
    height,
    scale = 2
) {

    const canvas =
        document.createElement("canvas");

    canvas.width =
        Math.round(width * scale);

    canvas.height =
        Math.round(height * scale);

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        source,
        Math.round(x),
        Math.round(y),
        Math.round(width),
        Math.round(height),
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}


/* =====================================================
   OCR用前処理
===================================================== */

function preprocess(source) {

    const canvas =
        document.createElement("canvas");

    canvas.width =
        source.width;

    canvas.height =
        source.height;

    const ctx =
        canvas.getContext("2d");

    ctx.filter =
        "grayscale(1) contrast(1.4) brightness(1.05)";

    ctx.drawImage(
        source,
        0,
        0
    );

    return canvas;
}


/* =====================================================
   OCR
===================================================== */

async function recognize(
    worker,
    source,
    x,
    y,
    width,
    height
) {

    const image =
        preprocess(
            crop(
                source,
                x,
                y,
                width,
                height,
                2.5
            )
        );

    const result =
        await worker.recognize(image);

    return normalize(
        result.data.text
    );
}


/* =====================================================
   テキスト整理
===================================================== */

function normalize(text) {

    return String(text || "")
        .replace(/\r/g, " ")
        .replace(/\n+/g, " ")
        .replace(/[ \t]+/g, " ")
        .trim();
}


/* =====================================================
   番号
===================================================== */

function extractNumber(text) {

    let match =
        text.match(
            /TDS\s*([0-9]{5,8})/i
        );

    if (match) {

        return "TDS" + match[1];

    }

    match =
        text.match(
            /\b([0-9]{5,8})\b/
        );

    return match
        ? match[1]
        : "";
}


/* =====================================================
   名前
===================================================== */

function extractName(text) {

    const cleaned =
        text.replace(
            /様/g,
            " "
        );

    const match =
        cleaned.match(
            /([一-龯々ぁ-んァ-ヶー]{1,8})\s*([一-龯々ぁ-んァ-ヶー]{1,8})/
        );

    if (!match) {
        return "";
    }

    return (
        match[1] +
        " " +
        match[2]
    ).trim();
}


/* =====================================================
   クラス
===================================================== */

function extractClass(text) {

    const match =
        text.match(
            /\b([A-Z]\d{1,2})\b/
        );

    return match
        ? match[1]
        : "";
}


/* =====================================================
   チェックボックス判定
===================================================== */

function darkRatio(
    canvas,
    x,
    y,
    width,
    height
) {

    const ctx =
        canvas.getContext("2d");

    const image =
        ctx.getImageData(
            Math.max(0, x),
            Math.max(0, y),
            Math.min(
                width,
                canvas.width - x
            ),
            Math.min(
                height,
                canvas.height - y
            )
        );

    let dark = 0;

    for (
        let i = 0;
        i < image.data.length;
        i += 4
    ) {

        const gray =
            (
                image.data[i] +
                image.data[i + 1] +
                image.data[i + 2]
            ) / 3;

        if (gray < 150) {
            dark++;
        }
    }

    return dark /
        (image.data.length / 4);
}


function detectChange(canvas) {

    /*
       基準画像 1536 × 864

       変更なしチェック
       約 x=148 / y=336

       変更ありチェック
       約 x=148 / y=421
    */

    const sx =
        canvas.width / 1536;

    const sy =
        canvas.height / 864;

    const noChange =
        darkRatio(
            canvas,
            132 * sx,
            315 * sy,
            38 * sx,
            40 * sy
        );

    const change =
        darkRatio(
            canvas,
            132 * sx,
            400 * sy,
            38 * sx,
            40 * sy
        );

    if (
        noChange > 0.08 &&
        noChange > change * 1.25
    ) {
        return false;
    }

    if (
        change > 0.08 &&
        change > noChange * 1.25
    ) {
        return true;
    }

    return null;
}


/* =====================================================
   科目読み取り
===================================================== */

async function extractSubject(
    worker,
    canvas
) {

    const sx =
        canvas.width / 1536;

    const sy =
        canvas.height / 864;


    /*
      ユーザー指定：

      x = 59%
      y = 34%

      1536 × 864 の場合

      x ≒ 906px
      y ≒ 294px

      この座標を「科目欄の基準点」とする。

      スキャンのズレに対応するため、
      点そのものではなく周囲を広めにOCRする。
    */

    const anchorX =
        0.59 * canvas.width;

    const anchorY =
        0.34 * canvas.height;


    const width =
        420 * sx;

    const height =
        170 * sy;


    const left =
        anchorX - 210 * sx;

    const top =
        anchorY - 70 * sy;


    const text =
        await recognize(
            worker,
            canvas,
            left,
            top,
            width,
            height
        );


    return cleanSubject(text);
}


/* =====================================================
   科目のノイズ除去
===================================================== */

function cleanSubject(text) {

    let result =
        normalize(text);

    result =
        result
        .replace(
            /変更内容/g,
            ""
        )
        .replace(
            /変更理由/g,
            ""
        )
        .replace(
            /変更申請/g,
            ""
        )
        .replace(
            /[《》「」『』]/g,
            ""
        )
        .replace(
            /[|｜_＿]+/g,
            " "
        )
        .trim();


    /*
       長すぎる文章は
       科目OCRとして不自然なので
       確認対象にする。
    */

    if (
        result.length > 20
    ) {
        return "";
    }


    return result;
}


/* =====================================================
   結果表示
===================================================== */

function renderResults() {

    count.textContent =
        `${results.length}件`;


    if (!results.length) {

        resultBody.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    まだ読み取り結果がありません。
                </td>
            </tr>
        `;

        return;
    }


    resultBody.innerHTML =
        results.map(
            (row, index) => {

                const warning =
                    !row.number ||
                    !row.name ||
                    row.change === null ||
                    (
                        row.change === false &&
                        !row.klass
                    ) ||
                    (
                        row.change === true &&
                        !row.subject
                    );


                return `
                <tr
                    class="${warning ? "warning" : ""}"
                >

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <input
                            data-index="${index}"
                            data-key="number"
                            value="${escapeHtml(row.number)}"
                        >
                    </td>

                    <td>
                        <input
                            data-index="${index}"
                            data-key="name"
                            value="${escapeHtml(row.name)}"
                        >
                    </td>

                    <td>
                        <input
                            data-index="${index}"
                            data-key="klass"
                            value="${escapeHtml(row.klass)}"
                        >
                    </td>

                    <td>
                        <input
                            data-index="${index}"
                            data-key="subject"
                            value="${escapeHtml(row.subject)}"
                        >
                    </td>

                    <td>
                        ${escapeHtml(row.file)}
                        /
                        ${row.page}ページ
                    </td>

                </tr>
                `;
            }
        ).join("");


    resultBody
        .querySelectorAll("input")
        .forEach(input => {

            input.addEventListener(
                "input",
                event => {

                    const index =
                        Number(
                            event.target.dataset.index
                        );

                    const key =
                        event.target.dataset.key;

                    results[index][key] =
                        event.target.value;

                }
            );

        });
}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]
        );
}


/* =====================================================
   PDF読み取り
===================================================== */

startButton.addEventListener(
    "click",
    async () => {

        startButton.disabled = true;
        csvButton.disabled = true;

        results = [];

        try {

            status.textContent =
                "OCRエンジンを準備しています…";


            const Tesseract =
                await loadTesseract();


            const worker =
                await Tesseract.createWorker(
                    "jpn",
                    1,
                    {
                        logger: message => {

                            if (
                                message.status ===
                                "recognizing text"
                            ) {

                                status.textContent =
                                    `OCR中… ${
                                        Math.round(
                                            (message.progress || 0) *
                                            100
                                        )
                                    }%`;

                            }

                        }
                    }
                );


            await worker.setParameters({

                preserve_interword_spaces: "1",

                tessedit_pageseg_mode: "6"

            });


            let totalPages = 0;


            for (
                const file of selectedFiles
            ) {

                const pdf =
                    await pdfjsLib
                    .getDocument({
                        data:
                            await file.arrayBuffer()
                    })
                    .promise;

                totalPages +=
                    pdf.numPages;

            }


            let processedPages = 0;


            for (
                const file of selectedFiles
            ) {

                const pdf =
                    await pdfjsLib
                    .getDocument({
                        data:
                            await file.arrayBuffer()
                    })
                    .promise;


                for (
                    let pageNumber = 1;
                    pageNumber <= pdf.numPages;
                    pageNumber++
                ) {

                    processedPages++;


                    progressBar.style.width =
                        `${Math.round(
                            processedPages /
                            totalPages *
                            100
                        )}%`;


                    status.textContent =
                        `${file.name}：${pageNumber}/${pdf.numPages}ページを処理中…`;


                    const canvas =
                        await renderPage(
                            pdf,
                            pageNumber
                        );


                    const sx =
                        canvas.width / 1536;

                    const sy =
                        canvas.height / 864;


                    /* -------------------------
                       番号
                    ------------------------- */

                    const numberText =
                        await recognize(
                            worker,
                            canvas,

                            215 * sx,
                            145 * sy,

                            455 * sx,
                            100 * sy
                        );


                    /* -------------------------
                       名前
                    ------------------------- */

                    const nameText =
                        await recognize(
                            worker,
                            canvas,

                            775 * sx,
                            145 * sy,

                            475 * sx,
                            100 * sy
                        );


                    /* -------------------------
                       クラス
                    ------------------------- */

                    const classText =
                        await recognize(
                            worker,
                            canvas,

                            1250 * sx,
                            145 * sy,

                            195 * sx,
                            100 * sy
                        );


                    /* -------------------------
                       変更判定
                    ------------------------- */

                    const change =
                        detectChange(canvas);


                    let klass = "";
                    let subject = "";


                    /*
                       変更なし
                       → クラスを入れる
                       → 科目は空欄
                    */

                    if (
                        change === false
                    ) {

                        klass =
                            extractClass(
                                classText
                            );

                        subject = "";

                    }


                    /*
                       変更あり
                       → クラスは空欄
                       → 科目を読む
                    */

                    if (
                        change === true
                    ) {

                        klass = "";

                        subject =
                            await extractSubject(
                                worker,
                                canvas
                            );

                    }


                    results.push({

                        number:
                            extractNumber(
                                numberText
                            ),

                        name:
                            extractName(
                                nameText
                            ),

                        klass,

                        subject,

                        change,

                        file:
                            file.name,

                        page:
                            pageNumber

                    });


                    renderResults();

                }

            }


            await worker.terminate();


            status.textContent =
                `読み取り完了：${results.length}件`;


            csvButton.disabled =
                results.length === 0;

            clearButton.disabled = false;

        }
        catch (error) {

            console.error(error);

            status.textContent =
                "読み取り中にエラーが発生しました。";

        }


        startButton.disabled = false;

    }
);


/* =====================================================
   CSV
===================================================== */

csvButton.addEventListener(
    "click",
    () => {

        const data = [

            [
                "番号",
                "名前",
                "クラス",
                "科目"
            ],

            ...results.map(row => [

                row.number,
                row.name,
                row.klass,
                row.subject

            ])

        ];


        const csvText =
            "\uFEFF" +
            data
            .map(
                row =>
                    row
                    .map(
                        value =>
                            `"${String(value ?? "")
                                .replace(/"/g, '""')}"`
                    )
                    .join(",")
            )
            .join("\r\n");


        const blob =
            new Blob(
                [csvText],
                {
                    type:
                        "text/csv;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "講習受講確認一覧.csv";

        link.click();


        URL.revokeObjectURL(url);

    }
);


/* =====================================================
   クリア
===================================================== */

clearButton.addEventListener(
    "click",
    () => {

        selectedFiles = [];
        results = [];

        pdfInput.value = "";

        progressBar.style.width =
            "0%";

        status.textContent =
            "PDFを選択してください。";

        startButton.disabled = true;
        csvButton.disabled = true;
        clearButton.disabled = true;

        renderResults();

    }
);
